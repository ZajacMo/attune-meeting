name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      # setup-uv v6+ only creates the project virtualenv when
      # activate-environment is true; that is where the matrix Python
      # version is applied, so it stays on to keep 3.10 and 3.12 distinct.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install dependencies
        run: uv sync --extra dev --extra server
      - name: Lint
        run: uv run ruff check src tests experiments
      - name: Format check
        run: uv run ruff format --check src tests experiments
      - name: Test
        run: uv run pytest

  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: [quality, build]
    # Gated on the PyPI trusted publisher being configured for this repository.
    # A tag pushed before that exists would fail the upload, so the job stays
    # off until the repository variable says the project is ready.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
          # v8 fails the job on a digest mismatch. This job is the release
          # path, so keep a mismatch a warning instead of a hard failure.
          digest-mismatch: warn
      - uses: pypa/gh-action-pypi-publish@release/v1
